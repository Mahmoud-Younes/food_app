name: food_app
description: "A Food Recipe App built with Flutter & TheMealDB API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.8.0

  # State management
  flutter_bloc: ^9.1.0

  # Local storage (Favorites)
  shared_preferences: ^2.5.0

  # Network images
  cached_network_image: ^3.4.1

  # Open YouTube video links
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
